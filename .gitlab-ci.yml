stages:
  - build
  - test
  - code-analysis
  - security
  - publish

variables:
  PROJECT_NAME: ADONIS_PROJECT
  # Cache Maven dependencies inside the project dir so they can be reused between jobs
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

# Shared settings reused by every job via `extends`
.default-rules:
  rules:
    # Trigger on pushes to the main or develop
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
    # Trigger on merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Trigger when started manually
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # Trigger on schedules
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # Otherwise, do not run the job
    - when: never

.maven-job:
  extends: .default-rules
  image: maven:3.9.9-eclipse-temurin-17
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository

# Build stage
build-job:
  stage: build
  extends: .maven-job
  script:
    - echo "Building the project ${PROJECT_NAME}."
    - mvn clean install -DskipTests
  after_script:
    - ls -la target
  artifacts:
    paths:
      - target/*.war
    when: always

# Test stage
test-job:
  stage: test
  extends: .maven-job
  needs: ["build-job"]
  script:
    - echo "Running Unit Tests in the project ${PROJECT_NAME}."
    - mvn test
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
    reports:
      junit: target/surefire-reports/TEST-*.xml

# Code analysis stage - Checkstyle
checkstyle-job:
  stage: code-analysis
  extends: .maven-job
  needs: ["build-job"]
  script:
    - echo "Running Checkstyle analysis on ${PROJECT_NAME}."
    - mvn checkstyle:checkstyle
  after_script:
    - ls -la target/checkstyle-result.xml || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/checkstyle-result.xml
      - target/site/checkstyle.html

# Security stage - Trivy filesystem scan
security-scan:
  stage: security
  extends: .default-rules
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: ["build-job"]
  cache:
    # Reuse the Maven repo populated by build-job (read-only) so Trivy can resolve
    # parent POMs/BOMs locally instead of hitting Maven Central (which rate-limits shared runners)
    - key: maven-$CI_COMMIT_REF_SLUG
      paths:
        - .m2/repository
      policy: pull
    # Cache the Trivy vulnerability DB between pipelines
    - key: trivy-db
      paths:
        - .trivycache/
  script:
    # Trivy looks for the local Maven repo in ~/.m2/repository
    - mkdir -p "$HOME/.m2"
    - ln -sfn "$CI_PROJECT_DIR/.m2/repository" "$HOME/.m2/repository"
    - >
      trivy fs
      --cache-dir .trivycache/
      --offline-scan
      --skip-dirs .m2
      --skip-dirs .trivycache
      --scanners vuln
      --format json
      --exit-code 0
      --output trivy-results.json
      .
    # Gate: print HIGH/CRITICAL findings in the job log and fail the job if any exist.
    # Reuses the DB downloaded above. Accepted risks can be listed by CVE ID in a .trivyignore file.
    - >
      trivy fs
      --cache-dir .trivycache/
      --skip-db-update
      --offline-scan
      --skip-dirs .m2
      --skip-dirs .trivycache
      --scanners vuln
      --severity HIGH,CRITICAL
      --format table
      --exit-code 1
      .
  after_script:
    - ls -la
  artifacts:
    paths:
      - trivy-results.json
    when: always

# Publish stage - build the Docker image and push it to the GitLab Container Registry
docker-build-publish:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind          # sidecar that runs the Docker daemon
  # Only publish if tests, Checkstyle and the security scan all passed.
  # artifacts: false = don't download their reports (not needed to build the image)
  needs:
    - job: test-job
      artifacts: false
    - job: checkstyle-job
      artifacts: false
    - job: security-scan
      artifacts: false
  rules:
    # Only publish from main (not from feature branches or merge requests)
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    DOCKER_TLS_CERTDIR: "/certs"   # encrypted connection between job and dind sidecar
    IMAGE_TAG: $CI_COMMIT_SHA
  before_script:
    - echo "Logging in to GitLab Container Registry..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "Building Docker image with the multistage Dockerfile..."
    - docker build -f Docker-files/app/multistage/Dockerfile -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"

# Notify Slack when any job in the pipeline fails.
# Requires a masked CI/CD variable SLACK_WEBHOOK_URL (Settings > CI/CD > Variables).
notify-failure:
  stage: .post   # built-in stage that always runs last
  image:
    name: curlimages/curl:8.10.1
    entrypoint: [""]
  rules:
    # Skip quietly if the webhook hasn't been configured
    - if: '$SLACK_WEBHOOK_URL == null || $SLACK_WEBHOOK_URL == ""'
      when: never
    # Same triggers as the other jobs, but only run when something failed
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
      when: on_failure
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_failure
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_failure
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_failure
    - when: never
  cache: []
  dependencies: []   # don't download artifacts from earlier jobs
  script:
    - |
      REF="${CI_COMMIT_REF_NAME}"
      TEXT=":red_circle: *Pipeline failed* for *${CI_PROJECT_PATH}*\n*Branch:* \`${REF}\`\n*Commit:* <${CI_PROJECT_URL}/-/commit/${CI_COMMIT_SHA}|${CI_COMMIT_SHORT_SHA}>\n*Triggered by:* ${GITLAB_USER_LOGIN}\n<${CI_PIPELINE_URL}|View pipeline #${CI_PIPELINE_IID}>"
      curl --fail --silent --show-error -X POST \
        -H 'Content-Type: application/json' \
        --data "{\"text\": \"${TEXT}\"}" \
        "$SLACK_WEBHOOK_URL"
